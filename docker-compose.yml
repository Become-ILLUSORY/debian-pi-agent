services:
  pi:
    build:
      context: .
      args:
        DEBIAN_VERSION: ${DEBIAN_VERSION:-trixie-slim}
        NODE_VERSION: ${NODE_VERSION:-22.23.3}
        PI_VERSION: ${PI_VERSION:-latest}
        PI_REMOTE_FEISHU_VERSION: ${PI_REMOTE_FEISHU_VERSION:-latest}
        PI_FEISHU_EXTENSION: ${PI_FEISHU_EXTENSION:-1}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: ${IMAGE_NAME:-debian-pi-agent}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-pi-agent}
    hostname: ${CONTAINER_NAME:-pi-agent}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${SSH_PORT:-2222}:22"
    environment:
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:-}
      PI_WORKDIR: ${PI_WORKDIR:-/workspace}
      PI_RELAY_NAME: ${PI_RELAY_NAME:-relay}
      PI_RELAY_BASE_URL: ${PI_RELAY_BASE_URL:-}
      PI_RELAY_API_KEY: ${PI_RELAY_API_KEY:-}
      PI_RELAY_API: ${PI_RELAY_API:-openai-completions}
      PI_RELAY_MODELS: ${PI_RELAY_MODELS:-}
      PI_RELAY_MODEL_FILTER: ${PI_RELAY_MODEL_FILTER:-}
      PI_RELAY_EXCLUDE: ${PI_RELAY_EXCLUDE-embed,embedding,whisper,tts,rerank,moderation,dall-e,gpt-image,stable-diffusion,sdxl,flux,veo,sora,kling,seedream,seedance}
      PI_RELAY_DEFAULT_MODEL: ${PI_RELAY_DEFAULT_MODEL:-}
      PI_RELAY_CONTEXT_WINDOW: ${PI_RELAY_CONTEXT_WINDOW:-128000}
      PI_RELAY_MAX_TOKENS: ${PI_RELAY_MAX_TOKENS:-16384}
      PI_RELAY_VISION: ${PI_RELAY_VISION:-0}
      PI_RELAY_COST_INPUT: ${PI_RELAY_COST_INPUT:-0}
      PI_RELAY_COST_OUTPUT: ${PI_RELAY_COST_OUTPUT:-0}
      FEISHU_ENABLED: ${FEISHU_ENABLED:-auto}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BOT_NAME: ${FEISHU_BOT_NAME:-Pi Agent}
      FEISHU_CONFIG: ${FEISHU_CONFIG:-}
      FEISHU_GROUP_SCOPE: ${FEISHU_GROUP_SCOPE:-shared-chat}
      FEISHU_REQUIRE_MENTION: ${FEISHU_REQUIRE_MENTION:-1}
      FEISHU_DM_ENABLED: ${FEISHU_DM_ENABLED:-1}
      FEISHU_GROUP_ENABLED: ${FEISHU_GROUP_ENABLED:-1}
      FEISHU_ALLOW_USERS: ${FEISHU_ALLOW_USERS:-}
      FEISHU_ALLOW_CHATS: ${FEISHU_ALLOW_CHATS:-}
      FEISHU_RENDERING_MODE: ${FEISHU_RENDERING_MODE:-stream-card}
      FEISHU_LOG_LEVEL: ${FEISHU_LOG_LEVEL:-info}
      FEISHU_DEBUG_EVENTS: ${FEISHU_DEBUG_EVENTS:-0}
      FEISHU_MAX_UPLOAD_MB: ${FEISHU_MAX_UPLOAD_MB:-20}
      FEISHU_ALLOWED_OUTPUT_DIRS: ${FEISHU_ALLOWED_OUTPUT_DIRS:-}
      FEISHU_IDLE_TTL_MIN: ${FEISHU_IDLE_TTL_MIN:-}
      FEISHU_SHOW_TOOL_EVENTS: ${FEISHU_SHOW_TOOL_EVENTS:-1}
      FEISHU_CONFIG_FORCE: ${FEISHU_CONFIG_FORCE:-0}
      FEISHU_RESTART_LIMIT: ${FEISHU_RESTART_LIMIT:-5}
      TZ: ${TZ:-Asia/Shanghai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${DATA_DIR:-./data}/workspace:/workspace
      - ${DATA_DIR:-./data}/ssh:/etc/ssh/keys
      - ${DATA_DIR:-./data}/pi:/root/.pi
      - ${DATA_DIR:-./data}/gh:/root/.config/gh
      - pi-log:/var/log
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pi-log:
